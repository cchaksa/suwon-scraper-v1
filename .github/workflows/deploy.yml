name: Publish Worker Image to ECR

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: suwon-scraper

jobs:
  publish-image:
    # This pipeline only publishes worker container images.
    # ECS RunTask wiring (EventBridge Pipe / task launch) is managed in IaC.
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        docker build -t "$IMAGE_URI" .
        docker push "$IMAGE_URI"
        echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

    - name: Print published image URI for IaC handoff
      run: |
        echo "Published IMAGE_URI=${{ steps.build-image.outputs.image_uri }}"

    - name: Save IMAGE_URI artifact for IaC handoff
      run: |
        echo "${{ steps.build-image.outputs.image_uri }}" > image-uri.txt

    - name: Upload IMAGE_URI artifact
      uses: actions/upload-artifact@v4
      with:
        name: worker-image-uri
        path: image-uri.txt
        retention-days: 7

    - name: Add IaC handoff summary
      run: |
        echo "## Worker image published" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- IMAGE_URI: \`${{ steps.build-image.outputs.image_uri }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Artifact: \`worker-image-uri/image-uri.txt\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Next action: IaC(Terraform)에서 ECS RunTask 대상 이미지 값을 위 IMAGE_URI로 반영" >> "$GITHUB_STEP_SUMMARY"
